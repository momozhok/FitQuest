services:
  backend:
    build:
      context: ./le-frigo
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - lefrigo_sqlite:/data
    environment:
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "8080"
    networks:
      - fitquest

  frontend:
    build:
      context: ./le-frigo
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - fitquest

volumes:
  lefrigo_sqlite:

networks:
  fitquest:
